lex;flex-direction:column;justify-content:space-between;text-decoration:none}.card:nth-child(2){background:#f7dce4}.card:nth-child(3){background:var(--b)}.card:nth-child(4){background:var(--g)}.card h3{font:700 30px/1 var(--s);letter-spacing:-.04em;margin:12px 0}.status{font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;border:1px solid;padding:4px 7px;width:max-content}.manifest{background:#111;color:#fff;padding:55px 20px}.manifest div{max-width:900px;margin:auto}.manifest blockquote{font:700 clamp(45px,7vw,88px)/.95 var(--s);letter-spacing:-.05em;margin:0}.manifest p{max-width:650px;color:#ddd}.page{max-width:900px;margin:auto;padding:55px 20px 80px}.page h1{font:700 clamp(48px,7vw,88px)/.9 var(--s);letter-spacing:-.06em}.page h2{font:700 34px/1 var(--s);margin-top:42px}.page .deck{font:23px/1.35 var(--s);color:#4f4742}.page article{font:18px/1.75 var(--s)}.page blockquote{border-left:5px solid var(--pk);padding-left:20px;font:700 30px/1.1 var(--s)}.form{border:1px solid #111;background:#fff;padding:22px;margin-top:24px}.field{margin:0 0 12px}.field label{display:block;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #888;font:inherit}.field textarea{min-height:90px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.msg{font-weight:800;min-height:22px;margin-top:9px}.muted{color:var(--m);font-size:12px}.worlds{display:flex;gap:8px;overflow:auto}.world{min-width:210px;min-height:150px;padding:18px;border:1px solid #111;background:#fff}.world:nth-child(2){background:var(--pk)}.world:nth-child(3){background:var(--b)}.world:nth-child(4){background:var(--g)}.foot{background:#111;color:#ddd;padding:35px 20px;margin-top:0}.foot div{max-width:1200px;margin:auto}.foot strong{color:#fff}.hide{position:absolute;left:-9999px}.notice{padding:16px;border:1px dashed #777;background:#fff}.price{font:700 22px var(--s)}@media(max-width:760px){.nav{gap:10px}.nav a{font-size:10px}.hero{grid-template-columns:1fr}.hero>div{min-height:420px;padding:25px}.grid3,.grid4,.grid2,.two{grid-template-columns:1fr}.logo{font-size:28px}}
</style></head><body><header class=head><div class=mast><a class=logo href="#/">THE JOURNAL<small>Pretty, but all true.</small></a><nav class=nav><a href="#/journal">Journal</a><a href="#/digital">Digital</a><a href="#/worlds">Worlds</a><a href="#/personalize">Personalize</a><a href="#/shop">Shop</a></nav></div></header><main id=app></main><footer class=foot><div><strong>THE JOURNAL</strong> · Independent editorial + digital products. Glamoratti is a World/Archetype, not the parent brand. No payment is processed on this launch site.</div></footer><script>
const API='https://br-shy-snow-ay9puvn1-publicsite.compute.c-5.us-east-2.aws.neon.tech/submit',P={};
const card=(u,s,t,d,p='')=>`<a class=card href="#${u}"><span class=status>${s}</span><div><h3>${t}</h3><p>${d}</p></div>${p?`<span class=price>${p}</span>`:''}</a>`;
P['/']=`<div class=shell><section class=hero><div class=hero-main><span class=k>Issue 001 · September 2026</span><h1>Beauty gets better when it can survive a question.</h1><p>A fashion and culture publication for women who want desire, evidence, style, context, and real life in the same room.</p><div class=row><a class="btn light" href="#/journal">Read the Journal</a><a class=btn href="#/digital">Digital Editions</a></div></div><div class=hero-side><span class=k>Available now · $49</span><h2 class=title style="font-size:64px">MAKE<br>THIS<br>ME</h2><p>You do not need to know your aesthetic. Start with what you want clothes to do for you.</p><a class=btn href="#/personalize/world-prescription">Start my prescription</a></div></section><section class=section><span class=k>Latest Journal</span><h2>Read before you buy. Think while you look.</h2><div class=grid3>${card('/journal/the-intellectual-woman','Archetype','The Intellectual Woman','Intelligence is not a costume. Curiosity is not branding.')}${card('/journal/pretty-but-all-true','Manifesto','Pretty, But All True','Beauty, commerce, evidence, fit, sourcing, rights, and usefulness on the same page.')}${card('/journal/how-worlds-work','System','How Worlds Work','Discovery layers, not labels you have to memorize.')}</div></section><section class=section><span class=k>Digital Editions + Services</span><h2>Buy the thinking before the object.</h2><div class=grid4>${card('/personalize/world-prescription','Available','World Prescription','A practical one-page style direction.','$49')}${card('/personalize/mini-edit','Available','Mini Edit','A focused 3–5 item fashion edit.','from $29')}${card('/digital/the-pages-we-keep','Waitlist','The Pages We Keep','A Room of One’s Own through claim, evidence, counterreading, marginalia, and follow-trails.')}${card('/digital/curiosity','Coming Soon','Curiosity Archive','Notice. Follow. Complicate. Make.')}</div></section><section class=section><span class=k>Worlds</span><h2>Ways into the site, not boxes to live inside.</h2><div class=worlds>${['Intellectual Woman','Glamoratti','Modern Prep','Soft Luxury','Heartland Daughter','Romantic Heroine'].map(x=>`<div class=world><span class=k>World / Archetype</span><h3>${x}</h3></div>`).join('')}</div></section></div><section class=manifest><div><span class=k>The standard</span><blockquote>Pretty, but all true.</blockquote><p>We do not need to choose between pleasure and proof. Editorial fit, World relevance, commerce readiness, availability, rights, and usefulness stay distinct.</p></div></section><div class=shell><section class=section><h2>Newsletter</h2>${form('NEWSLETTER',`<div class=field><label>Email</label><input name=email type=email required></div>`,'Join')}</section></div>`;
const A={
 'the-intellectual-woman':['The Intellectual Woman','Intelligence is not a costume. Curiosity is not branding.',`<p>The Intellectual Woman is not simply a woman who is intelligent. She is a woman for whom thinking has become part of visible identity because the way she observes, questions, compares, reads, revises, and chooses leaves evidence.</p><blockquote>I want to understand. And I am willing to change my mind when understanding requires it.</blockquote><h2>Curiosity before performance</h2><p>She asks why, how, according to whom, what came before, what evidence supports the claim, what else could explain it, and what would prove her wrong.</p><p>Beauty and intellect are not competing identities. Formal education may be part of her life, but credential is not intellect; information is not understanding; contrarianism is not independent thought.</p><h2>Her mind leaves evidence</h2><p>In what she notices. In the distinctions she makes. In what she refuses to oversimplify. “I don’t know yet” can be intellectual discipline.</p>`],
 'pretty-but-all-true':['Pretty, But All True','Beauty does not become less beautiful when we ask for evidence.',`<p>There is a lazy split in fashion and commerce: beauty over here, proof over there. We reject the split.</p><blockquote>Pretty is not a waiver of reality.</blockquote><p>A product can be gorgeous and still need clear size, material, shipping, return, sourcing, and availability information. A trend can be culturally interesting without becoming an automatic buy recommendation.</p><h2>Editorial fit is not commerce readiness</h2><p>Something can belong in a story and still not be ready to sell. A product can fit a World and still have unresolved sourcing or returns. Those distinctions are how trust survives contact with commerce.</p><p>No fake scarcity. No fabricated reviews. No fake discounts. No pretending an unready product is for sale.</p>`],
 'how-worlds-work':['How Worlds Work','You do not need to know your aesthetic or memorize our taxonomy.',`<p>A World is a way of bringing related signals together. It can connect fashion, beauty, books, objects, places, food, interiors, history, people, music, rituals, and ideas.</p><h2>Worlds are not personality tests</h2><p>You may inhabit more than one. You may change. A product can belong to multiple Worlds. A story can cross them.</p><blockquote>The software may need categories. A human being does not need to become one.</blockquote><p>Traditional categories help when you know what you need. Worlds help when you know what you want to feel, explore, or become but do not yet know what will get you there.</p>`]};
for(const [k,v] of Object.entries(A))P['/journal/'+k]=page(v[0],v[1],`<article>${v[2]}</article><p><a href="#/journal">← Journal</a></p>`);
P['/journal']=page('Journal','Fashion, culture, ideas, identity, objects, and the evidence behind what we choose.',`<div class=grid3>${card('/journal/the-intellectual-woman','Archetype','The Intellectual Woman','Thinking as identity, not performance.')}${card('/journal/pretty-but-all-true','Manifesto','Pretty, But All True','Pleasure and proof together.')}${card('/journal/how-worlds-work','System','How Worlds Work','Discovery without flattening the person.')}</div>`);
P['/digital']=page('Digital Editions','Paid thinking, direction, and reading experiences before physical inventory.',`<div class=grid2>${card('/personalize/world-prescription','Available','Personalized World Prescription','One-page style direction.','$49')}${card('/personalize/mini-edit','Available','Mini Edit','A narrow 3–5 item edit.','from $29')}${card('/digital/the-pages-we-keep','Waitlist','The Pages We Keep','A Room of One’s Own reading experience.')}${card('/digital/curiosity','Coming Soon','Curiosity Archive / Intellectual Ledger','Part field notebook, commonplace book, research journal, and evidence file.')}</div>`);
P['/digital/the-pages-we-keep']=page('The Pages We Keep','A Room of One’s Own as an Intellectual Woman reading experience — not a generic printable.',`<p><strong>WAITLIST / NOT FOR SALE YET.</strong> Rights and source review must be complete before sale.</p><p>ENTRY → READ → CLAIM → EVIDENCE → COUNTERREADING → VERDICT → PRIVATE MARGINALIA → FOLLOW</p>${form('WAITLIST','<input type=hidden name=product value=THE_PAGES_WE_KEEP><div class=field><label>Email</label><input name=email type=email required></div>','Join waitlist')}`);
P['/digital/curiosity']=page('Curiosity Archive / Intellectual Ledger','Part field notebook, commonplace book, research journal, scrapbook, evidence file, and evolving archive of a mind.',`<p><strong>COMING SOON / NOT FOR SALE YET.</strong></p><p>NOTICE → FOLLOW → COMPLICATE → MAKE</p>${form('WAITLIST','<input type=hidden name=product value=CURIOSITY_ARCHIVE><div class=field><label>Email</label><input name=email type=email required></div>','Join waitlist')}`);
P['/personalize']=page('Personalize','You do not have to diagnose your aesthetic before you are allowed to ask for help.',`<div class=grid2>${card('/personalize/world-prescription','Available','World Prescription','Translate how you want to look and feel into a practical direction.','$49')}${card('/personalize/mini-edit','Available','Mini Edit','Solve one narrow wardrobe or shopping problem.','from $29')}</div>`);
P['/personalize/world-prescription']=page('Personalized World Prescription','You do not need to know your aesthetic. I translate what you want to look and feel like into a practical style direction.',`<p class=notice><strong>$49.</strong> This launch uses REQUEST / RESERVE. No payment is taken here.</p>${form('WORLD_PRESCRIPTION',`<div class=two><div class=field><label>Name</label><input name=name></div><div class=field><label>Email</label><input name=email type=email required></div></div><div class=field><label>What do you want your clothes to do for you?</label><textarea name=clothes_goal></textarea></div><div class=field><label>Lately, when I get dressed, I feel…</label><textarea name=current_feeling></textarea></div><div class=field><label>I wish I looked more…</label><textarea name=wish_more></textarea></div><div class=two><div class=field><label>Budget</label><input name=budget></div><div class=field><label>Size / fit notes</label><input name=size_fit></div></div><div class=field><label>Real-life needs</label><textarea name=real_life_needs></textarea></div><div class=field><label>Colors I love / avoid</label><input name=colors></div><div class=field><label>What do you keep buying but not wearing?</label><textarea name=buy_not_wear></textarea></div><div class=field><label>What do you want to change?</label><textarea name=change></textarea></div><div class=field><label>Optional inspiration links</label><textarea name=inspiration_links></textarea></div>`,'Request my prescription')}`);
P['/personalize/mini-edit']=page('Mini Edit','One narrow fashion problem. Three to five options. Proof notes instead of a wall of random links.',`<p class=notice><strong>from $29.</strong> This launch uses REQUEST / RESERVE. No payment is taken here.</p>${form('MINI_EDIT',`<div class=two><div class=field><label>Name</label><input name=name></div><div class=field><label>Email</label><input name=email type=email required></div></div><div class=field><label>What do you want me to solve?</label><textarea name=problem required></textarea></div><div class=two><div class=field><label>Budget</label><input name=budget></div><div class=field><label>Size / fit notes</label><input name=size_fit></div></div><div class=field><label>Preferences / dealbreakers</label><textarea name=preferences></textarea></div>`,'Request my edit')}`);
P['/worlds']=page('Worlds','Discovery and interpretation layers — not boxes you have to live inside.',`<div class=grid3>${['Intellectual Woman','Glamoratti','Modern Prep','Soft Luxury','Heartland Daughter','Romantic Heroine'].map(x=>`<div class=card><span class=status>World / Archetype</span><h3>${x}</h3><p>A route into editorial, wear, reading, beauty, objects, and related digital editions.</p></div>`).join('')}</div>`);
P['/shop']=page('Shop','Digital is live first. Physical fashion, beauty, and objects remain under curation.',`<div class=grid2>${card('/personalize/world-prescription','Available','World Prescription','Digital service.','$49')}${card('/personalize/mini-edit','Available','Mini Edit','Digital service.','from $29')}</div><div class=notice style="margin-top:20px"><strong>Fashion · Beauty · Objects:</strong> curation in progress. We are not fabricating inventory, stock, prices, reviews, or availability just to fill a grid.</div>`);
function page(t,d,b){return `<section class=page><span class=k>THE JOURNAL</span><h1>${t}</h1><p class=deck>${d}</p>${b}</section>`}function form(type,fields,cta){return `<form class=form data-type=${type}>${fields}<input class=hide name=website tabindex=-1><label class=muted><input type=checkbox name=consentEmail> You may email me about this request / signup.</label><br><button class=btn type=submit>${cta}</button><div class=msg aria-live=polite></div></form>`}
function bind(){document.querySelectorAll('form[data-type]').forEach(f=>f.onsubmit=submit)}async function submit(e){e.preventDefault();let f=e.currentTarget,m=f.querySelector('.msg'),d=new FormData(f),payload={};for(const[k,v]of d)if(!['email','name','website','consentEmail'].includes(k))payload[k]=v;m.textContent='Sending…';try{let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({submissionType:f.dataset.type,email:d.get('email'),name:d.get('name')||null,website:d.get('website')||'',consentEmail:d.get('consentEmail')==='on',sourceUrl:location.href,payload})}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'failed');m.textContent='Received. Your request is in the queue.';f.reset()}catch{x=m.textContent='I could not save that request. Please try again.'}}function route(){let p=location.hash.slice(1)||'/';app.innerHTML=P[p]||page('Not found','That page does not exist.','<a href="#/">Return home</a>');scrollTo(0,0);bind()}addEventListener('hashchange',route);route();
</script></body></html>
