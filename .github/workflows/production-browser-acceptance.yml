name: Production browser acceptance

on:
  push:
    branches: [public-editorial-launch-001]
    paths:
      - .github/workflows/production-browser-acceptance.yml
      - scripts/production-browser-acceptance.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://br-shy-snow-ay9puvn1-publicsite.compute.c-5.us-east-2.aws.neon.tech
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run production browser acceptance
        run: node scripts/production-browser-acceptance.mjs

      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-010r2-production-browser-acceptance
          path: browser-acceptance/
          if-no-files-found: error
          retention-days: 30
