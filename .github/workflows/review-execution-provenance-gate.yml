name: Review Execution Provenance Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  review-execution-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce ESA-REVIEW-EXECUTION-PROVENANCE-001
        run: python .governance/validate_review_execution.py
