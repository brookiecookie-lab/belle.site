name: Review Execution Provenance Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  review-execution-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce ESA-REVIEW-EXECUTION-PROVENANCE-001
        run: python .governance/validate_review_execution.py
      - name: Promote provenance-cleared commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "HEAD:refs/heads/governance-cleared" --force
          echo "GOVERNANCE_CLEARED_SHA=${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
