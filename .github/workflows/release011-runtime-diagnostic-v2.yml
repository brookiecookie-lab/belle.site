name: Release 011 runtime diagnostic v2

on:
  push:
    branches: [public-editorial-launch-001]
    paths:
      - '.github/workflows/release011-runtime-diagnostic-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-runtime-assets:
    runs-on: ubuntu-24.04
    steps:
      - name: Export isolated runtime patch sources
        run: |
          mkdir -p diagnostic
          curl --fail --show-error --silent \
            'https://br-shy-snow-ay9puvn1-publicsitefix.compute.c-5.us-east-2.aws.neon.tech/' \
            -o diagnostic/release-patch-sources.json
          python - <<'PY'
          import json
          p='diagnostic/release-patch-sources.json'
          j=json.load(open(p))
          print('ok=',j.get('ok'))
          for k,v in (j.get('assets') or {}).items():
              print(k,'compressed=',v.get('compressed_bytes'),'source=',v.get('source_bytes'),'source_sha=',v.get('source_sha256'))
          if not j.get('ok'):
              raise SystemExit(j)
          PY
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release011-runtime-diagnostic-v2
          path: diagnostic/
          if-no-files-found: error
          retention-days: 30
