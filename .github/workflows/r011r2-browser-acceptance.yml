name: Release 011 R2 Browser Acceptance
on:
  push:
    branches: [public-editorial-launch-001]
    paths:
      - '.github/workflows/r011r2-browser-acceptance.yml'
      - 'scripts/r011r2-browser-acceptance.mjs'
jobs:
  browser-acceptance:
    runs-on: ubuntu-24.04
    env:
      BASE_URL: https://br-shy-snow-ay9puvn1-publicsitefix.compute.c-5.us-east-2.aws.neon.tech
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Release 011 R2 acceptance
        run: node scripts/r011r2-browser-acceptance.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-011r2-browser-acceptance
          path: browser-acceptance-r011r2/
          if-no-files-found: error
          retention-days: 30
